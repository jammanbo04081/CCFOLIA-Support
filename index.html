<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoC 코코포리아 매크로 변환기</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
    .container { max-width: 700px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); border: 1px solid #2a2a2a; }
    h2 { margin-top: 0; color: #ffffff; text-align: center; font-weight: 600; letter-spacing: -0.5px; }
    label { font-weight: bold; margin-bottom: 8px; display: block; color: #cccccc; }
    textarea { width: 100%; height: 180px; background: #141414; color: #e0e0e0; border: 1px solid #333333; border-radius: 6px; padding: 12px; font-family: monospace; resize: vertical; margin-bottom: 15px; }
    textarea:focus { outline: none; border-color: #555555; }
    .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; background: #252525; padding: 14px 16px; border-radius: 6px; border: 1px solid #333333; }
    .options label { font-weight: normal; color: #b0b0b0; margin: 0; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    button { width: 100%; padding: 12px; background: #000000; color: #ffffff; border: 1px solid #333333; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s, border-color 0.2s; margin-bottom: 15px; }
    button:hover { background: #1a1a1a; border-color: #555555; }
    .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .copy-btn { width: auto; padding: 6px 14px; margin: 0; font-size: 13px; background: #000000; color: #ffffff; border: 1px solid #333333; border-radius: 4px; }
    .copy-btn:hover { background: #1a1a1a; border-color: #555555; }
  </style>
</head>
<body>

<div class="container">
  <h2>CoC 코코포리아 매크로 변환기</h2>

  <label for="input">입력 (텍스트 복사-붙여넣기):</label>
  <textarea id="input" placeholder="예시:&#10;STR15 DEX14 APP16 HP10 MP12&#10;근력50 DEX 65 HP 10 관찰력 70%"></textarea>

  <div class="options">
    <label>
      <input type="checkbox" id="translateEng" checked>
      영어 약어를 한글로 변환 (예: STR → 근력, DEX → 민첩)
    </label>
    <label>
      <input type="checkbox" id="convert6to7" checked>
      CoC 6판 특성치(20 이하) 자동 5배 변환 (예: 14 → 70)
    </label>
  </div>

  <button onclick="convert()">변환하기</button>

  <div class="output-header">
    <label for="output">결과 (코코포리아 매크로):</label>
    <button class="copy-btn" onclick="copyOutput()">복사하기</button>
  </div>
  <textarea id="output" readonly></textarea>
</div>

<script>
  // 영어 약어 -> 한글 변환 매핑
  const statMap = {
    "STR": "근력",
    "DEX": "민첩",
    "CON": "건강",
    "APP": "외모",
    "POW": "정신",
    "SIZ": "크기",
    "INT": "지능",
    "EDU": "교육",
    "SAN": "이성"
  };

  // 제외 대상 목록 (HP, MP 및 한글 표현)
  const excludeList = ["HP", "MP", "체력", "마력"];

  // 6판 특성치 자동 판단용 키 목록
  const stats6th = ["근력", "민첩", "민첩성", "건강", "체력", "외모", "지능", "정신", "정신력", "크기", "교육", ...Object.keys(statMap)];

  function convert() {
    const inputText = document.getElementById("input").value;
    const isTranslate = document.getElementById("translateEng").checked;
    const is6to7 = document.getElementById("convert6to7").checked;

    const regex = /([a-zA-Z가-힣]+)\s*[:=]?\s*(\d+)%?/g;
    
    let match;
    const results = [];

    while ((match = regex.exec(inputText)) !== null) {
      let name = match[1].trim();
      let value = parseInt(match[2], 10);
      const upperName = name.toUpperCase();

      // HP, MP 및 체력/마력 항목은 매크로 변환에서 제외
      if (excludeList.includes(upperName)) {
        continue;
      }

      // 6판 특성치 5배 변환 로직
      if (is6to7) {
        if (stats6th.includes(upperName) && value <= 20) {
          value = value * 5;
        }
      }

      // 영어 약어 -> 한글 변환 로직
      if (isTranslate && statMap[upperName]) {
        name = statMap[upperName];
      }

      results.push(`CC<=${value} ${name}`);
    }

    document.getElementById("output").value = results.join('\n');
  }

  function copyOutput() {
    const outputText = document.getElementById("output");
    if (!outputText.value) return;
    
    outputText.select();
    navigator.clipboard.writeText(outputText.value);
    alert("클립보드에 복사되었습니다!");
  }
</script>

</body>
</html>
