<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoC 코코포리아 매크로 변환기</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #e0e0e0; margin: 0; padding: 20px; }
    .container { max-width: 700px; margin: 0 auto; background: #252526; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; color: #4ec9b0; text-align: center; }
    label { font-weight: bold; margin-bottom: 8px; display: block; color: #9cdcfe; }
    textarea { width: 100%; height: 180px; background: #1e1e1e; color: #dcdcdc; border: 1px solid #3c3c3c; border-radius: 6px; padding: 12px; font-family: monospace; resize: vertical; margin-bottom: 15px; }
    textarea:focus { outline: none; border-color: #007acc; }
    .options { display: flex; gap: 20px; margin-bottom: 20px; background: #2d2d2d; padding: 12px 16px; border-radius: 6px; }
    .options label { font-weight: normal; color: #ce9178; margin: 0; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    button { width: 100%; padding: 12px; background: #0e639c; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-bottom: 15px; }
    button:hover { background: #1177bb; }
    .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .copy-btn { width: auto; padding: 6px 12px; margin: 0; font-size: 13px; background: #3a3d41; }
    .copy-btn:hover { background: #4e5257; }
  </style>
</head>
<body>

<div class="container">
  <h2>CoC 코코포리아 매크로 변환기</h2>

  <label for="input">입력 (텍스트 복사-붙여넣기):</label>
  <textarea id="input" placeholder="예시:&#10;STR15 DEX14 APP16&#10;근력50 DEX 65 관찰력 70%&#10;체력 12 (6판 특성치)"></textarea>

  <div class="options">
    <label>
      <input type="checkbox" id="convert6to7" checked>
      CoC 6판 특성치(20 이하) 자동 5배 변환 (예: 14 → 70)
    </label>
  </div>

  <button onclick="convert()">변환하기</button>

  <div class="output-header">
    <label for="output">결과 (코코포리아 매크로):</label>
    <button class="copy-btn" onclick="copyOutput()">복사하기</button>
  </div>
  <textarea id="output" readonly></textarea>
</div>

<script>
  // 6판 특성치로 주로 사용되는 주요 능력치 목록
  const stats6th = ["근력", "민첩성", "체력", "외모", "지능", "정신력", "크기", "교육", "STR", "DEX", "CON", "APP", "INT", "POW", "SIZ", "EDU"];

  function convert() {
    const inputText = document.getElementById("input").value;
    const is6to7 = document.getElementById("convert6to7").checked;

    // 공백 유무에 상관없이 한글/영문 이름과 숫자를 정확히 분리하는 정규식
    const regex = /([a-zA-Z가-힣]+)\s*[:=]?\s*(\d+)%?/g;
    
    let match;
    const results = [];

    while ((match = regex.exec(inputText)) !== null) {
      let name = match[1].trim();
      let value = parseInt(match[2], 10);

      // 6판 특성치 5배 변환 로직
      if (is6to7) {
        const upperName = name.toUpperCase();
        // 특성치 이름에 해당하고 값이 20 이하인 경우 5배 적용
        if (stats6th.includes(upperName) && value <= 20) {
          value = value * 5;
        }
      }

      results.push(`CC<=${value} ${name}`);
    }

    document.getElementById("output").value = results.join('\n');
  }

  function copyOutput() {
    const outputText = document.getElementById("output");
    if (!outputText.value) return;
    
    outputText.select();
    navigator.clipboard.writeText(outputText.value);
    alert("클립보드에 복사되었습니다!");
  }
</script>

</body>
</html>
